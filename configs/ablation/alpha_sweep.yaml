# Entropy temperature ablation (axis 1 of 4).
# scripts/run_ablation.py reads `base_config` then overrides `sweep_param`
# with each value in `sweep_values` in turn -- one full training run per value.

base_config: configs/halfcheetah_base.yaml
sweep_param: alpha
sweep_values: [0.0, 0.05, 0.2, 1.0]
also_run_auto_tuned: true   # one extra run with auto_tune_alpha: true, alpha ignored
